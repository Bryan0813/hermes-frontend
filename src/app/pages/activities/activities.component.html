<div class="header">
  <h2>Actividades</h2>
  <dx-button text="Crear" type="default" icon="add" (onClick)="showPopup()">
  </dx-button>
</div>

<div class="container content-block">
  <!-- table -->
  <dx-data-grid
    class="dx-card content-block"
    keyExpr="id"
    width="100%"
    [dataSource]="activities"
    [showBorders]="true"
    [columnAutoWidth]="true"
  >
    <!-- opciones de la tabla -->

    <dxo-filter-row [visible]="true"></dxo-filter-row>
    <!-- <dxo-search-panel [visible]="true" [highlightCaseSensitive]="true"></dxo-search-panel> -->

    <!-- Columnas -->
    <dxi-column
      dataField="id"
      dataType="number"
      width="100"
      alignment="left"
    ></dxi-column>
    <dxi-column
      dataField="name"
      dataType="string"
      width="500"
      alignment="left"
    ></dxi-column>

    <!-- botones de accion -->
    <dxi-column type="buttons" width="100" alignment="left">
      <dxi-button name="edit" [visible]="true" [onClick]="editActivity">
      </dxi-button>
      <dxi-button name="delete" [visible]="true" [onClick]="deleteActivity">
      </dxi-button>
    </dxi-column>

    <dxo-paging [pageSize]="5"></dxo-paging>
    <dxo-pager
      [showPageSizeSelector]="true"
      [showInfo]="true"
      [visible]="true"
    ></dxo-pager>
  </dx-data-grid>

  <!-- Popup -->
  <app-popup
    [(visible)]="popupVisible"
    [width]="400"
    [height]="300"
    title="Actividad"
  >
    <app-activity-form
      [activity]="activity"
      (onSave)="saveActivity($event)"
      (onCancel)="closePopup()"
    ></app-activity-form>
  </app-popup>
</div>
